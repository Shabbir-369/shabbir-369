<svg width="760" height="224" viewBox="0 0 760 224" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="rgba(27,31,36,0.035)" />
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </radialGradient>
    <clipPath id="card-clip">
      <rect x="0.5" y="0.5" width="759" height="223" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="760" height="224" fill="#f6f8fa" />

    <!-- title bar -->
    <rect x="0" y="0" width="760" height="32" fill="#eaeef2" />
    <circle cx="18" cy="16" r="5" fill="#ff5f56" />
    <circle cx="36" cy="16" r="5" fill="#ffbd2e" />
    <circle cx="54" cy="16" r="5" fill="#27c93f" />
    <text x="78" y="20" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="12" fill="#6e7781">shabbir-369@github:~$ ./analytics.sh --live</text>
    <line x1="0" y1="32" x2="760" y2="32" stroke="#c9d1d9" stroke-width="1" />

    <!-- stats -->
    <text x="130" y="86" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-weight="700" font-size="32" fill="#166e34" filter="url(#glow)">0</text>
    <text x="130" y="110" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" fill="#3d4b42"># total_contributions</text>
    <text x="130" y="128" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="10" fill="#6e7781">Sep 2026 -&gt; now</text>

    <line x1="253" y1="46" x2="253" y2="146" stroke="#c9d1d9" stroke-width="1" />

    <text x="380" y="86" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-weight="700" font-size="32" fill="#8a5a00" filter="url(#glow)">0</text>
    <text x="380" y="110" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" fill="#3d4b42"># current_streak</text>
    <text x="380" y="128" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="10" fill="#6e7781">as of Sep 25</text>

    <line x1="507" y1="46" x2="507" y2="146" stroke="#c9d1d9" stroke-width="1" />

    <text x="630" y="86" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-weight="700" font-size="32" fill="#166e34" filter="url(#glow)">0</text>
    <text x="630" y="110" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" fill="#3d4b42"># longest_streak</text>
    <text x="630" y="128" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="10" fill="#6e7781">-</text>

    <line x1="0" y1="160" x2="760" y2="160" stroke="#c9d1d9" stroke-width="1" />

    <!-- prompt -->
    <text x="20" y="190" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="13" fill="#3d4b42">guest@shabbir-369:~$ <tspan fill="#6e7781">_</tspan></text>
    <rect x="182" y="178" width="8" height="14" fill="#166e34">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite" />
    </rect>

    <!-- CRT texture -->
    <rect x="0" y="0" width="760" height="224" fill="url(#scan)" />
    <rect x="0" y="0" width="760" height="224" fill="url(#vignette)" />
  </g>

  <rect x="0.5" y="0.5" width="759" height="223" rx="10" fill="none" stroke="#c9d1d9" stroke-width="1" />
</svg>
