<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
<title id="title">Shabbir Ezzy terminal profile</title>
<desc id="desc">Terminal-style profile header for Shabbir Ezzy, a full-stack developer and builder focused on C++ and DSA, AI and IoT.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b0f12"/>
    <stop offset="1" stop-color="#070a0c"/>
  </linearGradient>
</defs>
<rect width="1180" height="420" rx="18" fill="#070a0c"/>
<rect x="14" y="14" width="1152" height="392" rx="15" fill="url(#g)" stroke="#2a3338" stroke-width="2"/>
<rect x="14" y="14" width="1152" height="54" rx="15" fill="#0d1215"/>
<circle cx="38" cy="41" r="6" fill="#d14d41"/>
<circle cx="59" cy="41" r="6" fill="#d4a72c"/>
<circle cx="80" cy="41" r="6" fill="#2da44e"/>
<text x="106" y="47" font-family="monospace" font-size="16" fill="#d7e0d9">shabbir@github:~$ ./profile --boot</text>
<text x="1140" y="47" text-anchor="end" font-family="monospace" font-size="11" fill="#7f8b82">PROFILE OS / ONLINE</text>

<text x="40" y="100" font-family="monospace" font-size="12" fill="#7f8b82">$ whoami</text>
<text x="40" y="142" font-family="monospace" font-size="38" font-weight="700" fill="#7ee787">SHABBIR EZZY</text>
<text x="40" y="169" font-family="monospace" font-size="15" fill="#d7e0d9">FULL-STACK DEVELOPER   ·   BUILDER   ·   C++ / DSA   ·   AI + IoT</text>
<text x="40" y="199" font-family="monospace" font-size="12" fill="#7f8b82">Turning curiosity into code — one commit at a time.</text>

<rect x="40" y="226" width="245" height="68" rx="9" fill="#0d1215" stroke="#2a3338"/>
<text x="58" y="250" font-family="monospace" font-size="11" fill="#7f8b82">$ mode</text>
<text x="58" y="275" font-family="monospace" font-size="18" font-weight="700" fill="#7ee787">BUILD</text>
<text x="255" y="275" text-anchor="end" font-family="monospace" font-size="10" fill="#7f8b82">ACTIVE</text>

<rect x="305" y="226" width="245" height="68" rx="9" fill="#0d1215" stroke="#2a3338"/>
<text x="323" y="250" font-family="monospace" font-size="11" fill="#7f8b82">$ track</text>
<text x="323" y="275" font-family="monospace" font-size="18" font-weight="700" fill="#6ee7e7">LEARN</text>
<text x="520" y="275" text-anchor="end" font-family="monospace" font-size="10" fill="#7f8b82">C++ / CS</text>

<rect x="570" y="226" width="245" height="68" rx="9" fill="#0d1215" stroke="#2a3338"/>
<text x="588" y="250" font-family="monospace" font-size="11" fill="#7f8b82">$ ship</text>
<text x="588" y="275" font-family="monospace" font-size="18" font-weight="700" fill="#ffb454">PRODUCT</text>
<text x="795" y="275" text-anchor="end" font-family="monospace" font-size="10" fill="#7f8b82">FULL-STACK</text>

<rect x="835" y="226" width="315" height="68" rx="9" fill="#0d1215" stroke="#2a3338"/>
<text x="853" y="250" font-family="monospace" font-size="11" fill="#7f8b82">$ status</text>
<circle cx="1118" cy="258" r="6" fill="#7ee787"/>
<text x="853" y="275" font-family="monospace" font-size="18" font-weight="700" fill="#7ee787">ONLINE</text>
<text x="1118" y="275" text-anchor="end" font-family="monospace" font-size="10" fill="#7f8b82">READY TO BUILD</text>

<line x1="40" y1="330" x2="1140" y2="330" stroke="#2a3338"/>
<text x="40" y="358" font-family="monospace" font-size="12" fill="#7f8b82">$ motto</text>
<text x="40" y="388" font-family="monospace" font-size="18" fill="#d7e0d9">Build it. Break it. Understand it. Improve it.</text>
<text x="1140" y="388" text-anchor="end" font-family="monospace" font-size="11" fill="#7f8b82">v1.0 / shabbir-369</text>
</svg>