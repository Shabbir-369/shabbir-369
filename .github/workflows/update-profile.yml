name: Update GitHub Profile Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_dashboard.py"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

# Prevent a scheduled run and a manual/push-triggered run from racing each
# other and fighting over the same commit.
concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: Shabbir-369
        run: python scripts/generate_dashboard.py

      - name: Sanity-check the generated SVG
        run: |
          set -e
          FILE=assets/github-dashboard.svg
          if [ ! -s "$FILE" ]; then
            echo "::error::$FILE is missing or empty — refusing to commit a broken dashboard."
            exit 1
          fi
          if ! head -c 200 "$FILE" | grep -q "<svg"; then
            echo "::error::$FILE doesn't look like an SVG — refusing to commit."
            exit 1
          fi

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-dashboard.svg
          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "chore: refresh profile dashboard"
            git push
          fi
