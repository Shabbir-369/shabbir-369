name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # allow manual runs
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23166e34&color_dots=%23eef1ee,%23cfe8d9,%23a3d7b8,%2366c18f,%23166e34&color_dot_border=%23c9d1d9
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2339ff88&color_dots=%230a1512,%231c3a2c,%232a5c42,%2339ff88,%2339ff88&color_dot_border=%23050a08

      - name: Push the SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
